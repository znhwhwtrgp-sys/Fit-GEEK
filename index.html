.prev{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}

<script>
const CATS=['Oberteile','Hosen','Jacken','Schuhe','Accessoires'];
const SUBCATS={'Oberteile':['T-Shirt','Top','Hemd','Bluse','Pullover','Hoodie','Zipper'],'Hosen':['Kurze Hose','Lange Hose'],'Jacken':['Jacke','Mantel'],'Schuhe':['Schuhe'],'Accessoires':['Accessoire']};

let idb=null;
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('kleiderschrank',1);q.onupgradeneeded=()=>{q.result.createObjectStore('items',{keyPath:'id'});q.result.createObjectStore('outfits',{keyPath:'id'})};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);q.onblocked=()=>r(null)}catch(e){r(null)}})}
const store=(s,m)=>idb.transaction(s,m).objectStore(s);
const loadAll=s=>new Promise(r=>{if(!idb)return r([]);try{const q=store(s,'readonly').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])}catch(e){r([])}});
function put(s,o){if(!idb)return;try{store(s,'readwrite').put(o)}catch(e){S.persist=false}}
function del(s,id){if(!idb)return;try{store(s,'readwrite').delete(id)}catch(e){}}

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

/* ===== Wetter, KI, Foto-Verbesserung ===== */
const MODEL='claude-haiku-4-5-20251001';
const WT=c=>c===0?'Klar':c<3?'Heiter':c===3?'Bedeckt':c<50?'Nebel':c<60?'Nieselregen':c<68?'Regen':c<78?'Schnee':c<83?'Regenschauer':c<87?'Schneeschauer':'Gewitter';
function loadSet(){try{S.key=localStorage.getItem('kl_key')||'';S.loc=JSON.parse(localStorage.getItem('kl_loc')||'null')}catch(e){}}
function saveSet(){try{localStorage.setItem('kl_key',S.key||'');localStorage.setItem('kl_loc',JSON.stringify(S.loc))}catch(e){}}
async function loadWeather(){
  if(!S.loc)return;S.werr=false;
  try{const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${S.loc.lat}&longitude=${S.loc.lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2`)).json();
    const c=j.current,d=j.daily,pp=d.precipitation_probability_max[0]||0;
    S.w={t:c.temperature_2m,feel:c.apparent_temperature,code:c.weather_code,wind:c.wind_speed_10m,min:d.temperature_2m_min[0],max:d.temperature_2m_max[0],pp,rain:pp>=50||c.precipitation>0.1};
    S.wm={code:d.weather_code[1],min:d.temperature_2m_min[1],max:d.temperature_2m_max[1],pp:d.precipitation_probability_max[1]||0,rain:(d.precipitation_probability_max[1]||0)>=50,date:d.time[1]};S.sug=[]}
  catch(e){S.werr=true}
  render();
}
async function claude(content,max=500){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:max,messages:[{role:'user',content}]})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
  return JSON.parse(j.content.map(c=>c.text||'').join('').match(/\{[\s\S]*\}/)[0]);
}
async function aiDescribe(it){
  S.busy.add(it.id);render();
  try{const j=await claude([{type:'image',source:{type:'base64',media_type:it.img.startsWith('data:image/png')?'image/png':'image/jpeg',data:it.img.split(',')[1]}},{type:'text',text:`Das Foto zeigt ein Kleidungsstück. Antworte nur mit JSON ohne Erklärung: {"kategorie":"genau eine aus: ${CATS.join(' | ')}","unterkategorie":"bei Oberteile: T-Shirt, Top, Hemd, Bluse, Pullover, Hoodie oder Zipper; bei Hosen: Kurze Hose oder Lange Hose; sonst passende Unterkategorie","beschreibung":"höchstens 12 Wörter auf Deutsch, Farbe und Schnitt","material":"geschätzte Zusammensetzung, z. B. 80 % Baumwolle, 20 % Polyester","waerme":Zahl von 1 (sehr leicht) bis 5 (sehr warm),"wasserfest":true oder false}`}]);
    if(CATS.includes(j.kategorie))it.cat=j.kategorie;it.subcat=j.unterkategorie||it.subcat||((it.cat==='Oberteile')?'T-Shirt':(it.cat==='Hosen')?'Lange Hose':(SUBCATS[it.cat]||[''])[0]);
    it.desc=j.beschreibung||'';it.mat=j.material||'';it.warm=Math.min(5,Math.max(1,+j.waerme||2));it.wp=!!j.wasserfest;it.ai=true;put('items',it);S.sug=[]}
  catch(e){toast('KI-Analyse fehlgeschlagen: '+String(e.message||e).slice(0,70))}
  S.busy.delete(it.id);render();
}
function mixNow(weather=S.w){
  if(!weather){S.sug=[];return}
  const tg=weather.feel!==undefined?(weather.feel<0?5:weather.feel<8?4:weather.feel<15?3:weather.feel<22?2:1):(weather.max<5?4:weather.max<14?3:weather.max<22?2:1);
  const score=i=>-Math.abs((i.warm||2)-tg)*2+(weather.rain&&i.wp?3:0)+(i.desc?0.3:0);
  const pick=c=>S.items.filter(i=>i.cat===c).sort((a,b)=>score(b)-score(a))[0]||null;
  let r=[pick('Oberteile'),pick('Hosen')];
  if(tg>=3||weather.rain)r.push(pick('Jacken'));r.push(pick('Schuhe'));if(tg>=4)r.push(pick('Accessoires'));
  S.sug=r.filter(Boolean).map(i=>i.id);S.ai=false;
  S.why=`Aus deinem Schrank nach Wärmegrad ${tg}/5${weather.rain?' und Regenfestigkeit':''} ausgewählt. Die Teile sind nach deinen gespeicherten Angaben sortiert; Farben und Stil kannst du in „Beratung“ prüfen lassen.`;
}
function enhance(src){return new Promise(res=>{const im=new Image();im.onload=()=>{
  const W=im.width,H=im.height,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,W,H),p=d.data,m=new Uint8Array(W*H);
  const cs=[[0,0],[W-1,0],[0,H-1],[W-1,H-1]].map(([a,b])=>{const i=(b*W+a)*4;return[p[i],p[i+1],p[i+2]]});
  const bg=[0,1,2].map(j=>cs.reduce((u,q)=>u+q[j],0)/4),spread=Math.max(...cs.map(q=>Math.abs(q[0]-bg[0])+Math.abs(q[1]-bg[1])+Math.abs(q[2]-bg[2])));
  if(spread<50){
    const st=[],near=k=>{const i=k*4;return Math.abs(p[i]-bg[0])+Math.abs(p[i+1]-bg[1])+Math.abs(p[i+2]-bg[2])<60};
    const push=(a,b)=>{const k=b*W+a;if(!m[k]&&near(k)){m[k]=1;st.push(k)}};
    for(let a=0;a<W;a++){push(a,0);push(a,H-1)}for(let b=0;b<H;b++){push(0,b);push(W-1,b)}
    while(st.length){const k=st.pop(),a=k%W,b=(k-a)/W;if(a>0)push(a-1,b);if(a<W-1)push(a+1,b);if(b>0)push(a,b-1);if(b<H-1)push(a,b+1)}
  }
  const h=new Uint32Array(256);let n=0;for(let k=0;k<W*H;k++)if(!m[k]){const i=k*4;h[(p[i]*.3+p[i+1]*.59+p[i+2]*.11)|0]++;n++}
  let lo=0,hi=255,t=0;while(lo<254&&(t+=h[lo])<n*.02)lo++;t=0;while(hi>1&&(t+=h[hi])<n*.02)hi--;
  const g=255/Math.max(40,hi-lo),cl=v=>Math.max(0,Math.min(255,v));
  for(let k=0;k<W*H;k++){const i=k*4;if(m[k]){p[i]=p[i+1]=p[i+2]=255;continue}
    const q=[0,1,2].map(j=>cl((p[i+j]-lo)*g)),l=q[0]*.3+q[1]*.59+q[2]*.11;for(let j=0;j<3;j++)p[i+j]=cl(l+(q[j]-l)*1.12)}
  x.putImageData(d,0,0);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(src);im.src=src})}

function weatherBlock(title,w,kind){
  if(!w)return `<h2 class="sub">${title}</h2><p class="empty">${S.werr?'Wetter konnte nicht geladen werden.':'Wetter wird geladen …'}</p>`;
  const temp=kind==='today'&&w.feel!==undefined?`Gefühlt ${Math.round(w.feel)}° · `:'';
  const date=kind==='tomorrow'&&w.date?new Date(w.date+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'}):'';
  return `<h2 class="sub">${title}</h2><div class="wx"><div class="big">${Math.round(kind==='today'&&w.t!==undefined?w.t:(w.max+w.min)/2)}°</div><div><b>${WT(w.code)}${date?', '+esc(date):''}</b><br><small>${temp}${Math.round(w.min)}° bis ${Math.round(w.max)}° · Regenwahrscheinlichkeit ${w.pp}%${kind==='today'&&w.wind!==undefined?' · Wind '+Math.round(w.wind)+' km/h':''}</small></div></div>`;
}
function weatherSuggestion(w,kind){
  if(!S.items.length)return '<p class="empty">Füge zuerst Kleidung im Kleiderschrank hinzu.</p>';
  const old=S.w; if(kind==='today'&&!S.sug.filter(byId).length)mixNow(w);
  let ids=kind==='today'?S.sug.filter(byId):suggestForWeather(w);
  const p=order(ids.map(x=>typeof x==='string'?byId(x):x).filter(Boolean));
  return `${p.length?`<div class="prev">${p.map(i=>`<div class="pv"><img src="${i.img}" alt="${esc(i.cat)}"><div class="dsc" style="padding:4px 0 0">${esc(i.desc||i.cat)}</div></div>`).join('')}</div><p class="why">${kind==='today'?esc(S.why):'Vorschlag anhand der vorhergesagten Temperaturen und Regenwahrscheinlichkeit. Wärmegrad und Regentauglichkeit deiner Teile werden berücksichtigt.'}</p>`:'<p class="empty">Für diese Wetterlage fehlen passende Teile im Schrank.</p>'}<div class="row"><button class="ghost" data-act="tab" data-v="beratung">Farben & Stil prüfen</button>${S.key?`<button class="btn" data-act="weatherai" data-v="${kind}">KI-Outfit verfeinern</button>`:''}</div>`;
}
function suggestForWeather(w){const tg=w.max<5?4:w.max<14?3:w.max<22?2:1;const score=i=>-Math.abs((i.warm||2)-tg)*2+(w.rain&&i.wp?3:0);const pick=c=>S.items.filter(i=>i.cat===c).sort((a,b)=>score(b)-score(a))[0]||null;let r=[pick('Oberteile'),pick('Hosen')];if(tg>=3||w.rain)r.push(pick('Jacken'));r.push(pick('Schuhe'));if(tg>=4)r.push(pick('Accessoires'));return r.filter(Boolean)}
function vHeute(){
  if(!S.loc)return '<div class="wx"><div><b>Wetter für deinen Ort</b><br><small>Lege deinen Standort fest, damit ich Empfehlungen für heute und morgen anzeigen kann.</small></div></div><div class="form"><button class="btn" data-act="geo">Standort verwenden</button><button class="ghost" data-act="tab" data-v="einst">Stadt eingeben</button></div>';
  if(S.werr)return '<div class="wx">Das Wetter konnte nicht geladen werden. Prüfe deine Internetverbindung.</div><button class="ghost" data-act="reload">Erneut versuchen</button>';
  if(!S.w)return '<div class="wx">Wetter wird geladen …</div>';
  return `<p class="hint">${esc(S.loc.name)}</p>${weatherBlock('Wetter Heute',S.w,'today')}<h2 class="sub">Empfehlung für heutiges Wetter</h2>${weatherSuggestion(S.w,'today')}${weatherBlock('Wetter Morgen',S.wm,'tomorrow')}<h2 class="sub">Empfehlung für morgiges Wetter</h2>${S.wm?weatherSuggestion(S.wm,'tomorrow'):'<p class="empty">Morgenprognose wird geladen …</p>'}`;
}
function vBeratung(){
 const has=S.items.length>0;
 return `<h2 class="sub" style="margin-top:0">Deine Stilberatung</h2><p class="hint">Alle textbasierten Beratungen an einem Ort. KI-Funktionen nutzen deinen gespeicherten Schrank und benötigen deinen Claude-API-Schlüssel in den Einstellungen.</p>
 <section class="note"><b>Outfit-Beratung per Bild</b><p>Wähle Kleidungsstücke im Schrank aus und lasse Farben, Proportionen und Stil anhand der vorhandenen Fotos beurteilen.</p><button class="btn" data-act="advise">Ausgewählte Outfits beraten</button> <button class="ghost" data-act="tab" data-v="planen">Outfit zusammenstellen</button></section>
 <section class="note"><b>Farbberatung</b><p>Prüft die erkannten oder eingetragenen Farben auf harmonische Kombinationen und Kontraste.</p><button class="btn" data-act="colors">Farben analysieren</button></section>
 <section class="note"><b>Outfit generieren</b><p>Erstellt ein Outfit aus deinen vorhandenen Teilen – basierend auf Beschreibung, Kategorie, Wärmegrad, Material, Regenfestigkeit und Wetter, nicht per Zufall.</p><button class="btn" data-act="generate">Outfit passend zum Wetter erstellen</button></section>
 <section class="note"><b>Kaufberatung</b><p>Bevor du etwas kaufst, prüft die Beratung, welche ähnlichen Teile du schon besitzt und welche Lücke ein neues Kleidungsstück tatsächlich schließen könnte.</p><button class="btn" data-act="buyadvice">Kaufberatung starten</button></section>
 <div id="advice-result" class="why" aria-live="polite">${S.advice?esc(S.advice):'Deine Analyse erscheint hier.'}</div>${S.sug.filter(byId).length?'<div class="row"><button class="btn" data-act="sugsave">Vorgeschlagenes Outfit speichern</button></div>':''}
 ${!has?'<p class="empty">Füge zuerst Kleidungsstücke mit Fotos hinzu.</p>':''}`;
}

function vEdit(){
  const i=byId(S.edit);if(!i){S.edit=null;return vSchrank()}
  const L=['','Sehr leicht','Leicht','Mittel','Warm','Sehr warm'];
  return `<div class="row" style="margin-bottom:12px"><button class="ghost" data-act="back">Zurück</button></div><div class="ed"><img src="${i.img}" alt="">
  <div class="row" style="justify-content:center"><button class="btn" data-act="cutout">Hintergrund freistellen</button><button class="ghost" data-act="enh">Foto verbessern</button>${i.orig?'<button class="ghost" data-act="orig">Original</button>':''}${S.key?'<button class="ghost" data-act="ai1">KI neu beschreiben</button>':''}</div>
  ${S.busy.has(i.id)?'<p class="hint">KI analysiert …</p>':i.ai?'<p class="hint">Von der KI erstellt. Bitte prüfen und bei Bedarf ausbessern.</p>':''}
  <label>Beschreibung<textarea data-f="desc" rows="2">${esc(i.desc||'')}</textarea></label>
  <label>Material<input type="text" data-f="mat" value="${esc(i.mat||'')}" placeholder="z. B. 80 % Baumwolle, 20 % Polyester"></label>
  <label>Kategorie<select data-f="cat">${opts(i.cat)}</select></label>
  <label>Wärme<select data-f="warm">${[1,2,3,4,5].map(n=>`<option value="${n}"${(i.warm||2)===n?' selected':''}>${n}: ${L[n]}</option>`).join('')}</select></label>
  <label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox" data-f="wp" style="width:auto"${i.wp?' checked':''}> Wasserfest, regentauglich</label></div>`;
}
function vEinst(){
  return `<div class="set"><h2 class="sub" style="margin-top:0">Ort fürs Wetter</h2><p class="hint">Aktuell: ${S.loc?esc(S.loc.name):'nicht festgelegt'}</p>
  <div class="form"><input type="text" id="city" placeholder="Stadt, z. B. Forchheim" aria-label="Stadt"><button class="btn" data-act="city">Suchen</button><button class="ghost" data-act="geo">Standort verwenden</button></div>
  <h2 class="sub">KI-Funktionen</h2><p class="hint">Beschreibung, Material und Outfit-Empfehlung nutzen die Claude-API. Dafür brauchst du einen eigenen API-Schlüssel von console.anthropic.com, abgerechnet wird nach Verbrauch. Der Schlüssel bleibt nur auf diesem Gerät. Ohne Schlüssel funktionieren Wetter, der Regel-Vorschlag und die manuelle Eingabe weiter.</p>
  <input type="password" id="key" placeholder="sk-ant-…" value="${esc(S.key)}" autocomplete="off" aria-label="API-Schlüssel">
  <div class="row"><button class="btn" data-act="savekey">Schlüssel speichern</button>${S.key?'<button class="ghost" data-act="delkey">Entfernen</button>':''}</div></div>`;
}
async function runAdvice(kind,weather){
 if(!S.key){toast('Bitte zuerst in Einstellungen den Claude-API-Schlüssel eintragen');S.tab='einst';render();return}
 if(!S.items.length){toast('Füge zuerst Kleidungsstücke hinzu');return}
 const w=weather||(S.w||{});const list=S.items.map(i=>({id:i.id,kategorie:i.cat,beschreibung:i.desc||'nicht beschrieben',material:i.mat||'unbekannt',waerme:i.warm||2,wasserfest:!!i.wp,farbe:i.color||'aus Bild/Beschreibung ableiten',stil:i.style||'nicht angegeben'}));
 const task={color:'Analysiere harmonische Farbkombinationen aus diesem Kleiderschrank. Nenne konkrete Teile anhand ihrer IDs, passende Farbpaare, neutrale Basisfarben und Kombinationen, die eher kollidieren könnten.',outfit:'Berate ein Outfit anhand der gespeicherten Kleidungsinformationen und Fotos. Beurteile Farbharmonie, Stil, Proportionen und Anlass. Falls keine Teile im Plan ausgewählt sind, nutze passende Teile aus dem Schrank.',generate:'Generiere ein konkretes, stimmiges Outfit ausschließlich aus vorhandenen IDs. Berücksichtige Kategorie, Farbe, Stil, Material, Wärmegrad und Regenfestigkeit sowie das Wetter. Nicht zufällig auswählen. Gib IDs und Begründung zurück.',buy:'Erstelle eine Kaufberatung: Welche Kategorien/Farben/Funktionen sind im Schrank bereits mehrfach vertreten? Welche sinnvolle Lücke gibt es? Wann lohnt sich ein Kauf, wann wäre er redundant? Keine pauschalen Kaufempfehlungen.',weather:'Erstelle eine konkrete Outfit-Empfehlung ausschließlich aus vorhandenen IDs für die angegebene Wetterlage. Begründe Wärme, Regenfestigkeit, Farbkombination und Stil.'}[kind];
 const weatherText=w&&w.max!==undefined?`Wetter: ${WT(w.code||0)}, ${Math.round(w.min)}–${Math.round(w.max)} °C, Regenwahrscheinlichkeit ${w.pp||0} %, Regen erwartet: ${w.rain?'ja':'eher nein'}.`:'Wetterdaten derzeit nicht verfügbar.';
 const selected=S.sel.map(byId).filter(Boolean).map(i=>i.id);
 const prompt=`Du bist eine sorgfältige persönliche Stilberaterin. Verwende nur die Kleidungsstücke und IDs in der Liste. Erfinde keine vorhandenen Kleidungsstücke. ${task}
${weatherText}
Ausgewählte Outfit-IDs: ${selected.join(', ')||'keine'}.
Kleiderschrank als JSON:
${JSON.stringify(list)}
Antworte ausschließlich als JSON mit den Feldern {"ids":["vorhandene-id"],"text":"deutsche Beratung in klaren Absätzen, konkrete Begründung und Hinweise auf Unsicherheiten"}. Bei Kaufberatung und Farbberatung darf ids leer sein.`;
 toast('Beratung wird erstellt …');try{const imageItems=(kind==='outfit'&&selected.length?S.items.filter(i=>selected.includes(i.id)):S.items).slice(0,8);const content=[];for(const it of imageItems){content.push({type:'text',text:'Foto zum Kleidungsstück mit ID '+it.id+', Kategorie '+it.cat+', Beschreibung '+(it.desc||'keine Beschreibung')+'.'});if(it.img&&it.img.startsWith('data:image/jpeg'))content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:it.img.split(',')[1]}});else if(it.img&&it.img.startsWith('data:image/png'))content.push({type:'image',source:{type:'base64',media_type:'image/png',data:it.img.split(',')[1]}})}content.push({type:'text',text:prompt+'\nNutze die jeweils direkt vorher beschrifteten Fotos zur visuellen Farb- und Stilbeurteilung.'});const j=await claude(content,850);if(Array.isArray(j.ids)&&['generate','weather'].includes(kind)){const valid=j.ids.filter(id=>byId(id));if(valid.length){S.sug=valid;S.why=j.text||'';S.ai=true;}}S.advice=j.text||'Keine Beratung erhalten.';S.tab=kind==='weather'?'heute':'beratung';render();}catch(e){toast('Beratung fehlgeschlagen: '+String(e.message||e).slice(0,90))}
}
function removeBg(src){
 // Lokale Näherung: entfernt gleichmäßige, mit dem Bildrand verbundene Hintergründe.
 // Komplexe Hintergründe benötigen einen spezialisierten KI-Freisteller.
 return new Promise(resolve=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const W=c.width,H=c.height,d=x.getImageData(0,0,W,H),p=d.data,m=new Uint8Array(W*H),stack=[];
 const samples=[];for(const [a,b] of [[0,0],[W-1,0],[0,H-1],[W-1,H-1]]){const k=(b*W+a)*4;samples.push([p[k],p[k+1],p[k+2]])}const bg=[0,1,2].map(j=>samples.reduce((n,v)=>n+v[j],0)/samples.length);const tol=65;
 const near=k=>{const z=k*4;return Math.abs(p[z]-bg[0])+Math.abs(p[z+1]-bg[1])+Math.abs(p[z+2]-bg[2])<tol};const push=k=>{if(k>=0&&k<W*H&&!m[k]&&near(k)){m[k]=1;stack.push(k)}};
 for(let a=0;a<W;a++){push(a);push((H-1)*W+a)}for(let b=0;b<H;b++){push(b*W);push(b*W+W-1)}while(stack.length){const k=stack.pop(),a=k%W,b=(k-a)/W;if(a)push(k-1);if(a<W-1)push(k+1);if(b)push(k-W);if(b<H-1)push(k+W)}
 for(let k=0;k<W*H;k++)if(m[k])p[k*4+3]=0;x.putImageData(d,0,0);resolve(c.toDataURL('image/png'));}catch(e){resolve(src)}};im.onerror=()=>resolve(src);im.src=src;});
}

const A={
  open(id){S.edit=id;render();scrollTo(0,0)},
  back(){S.edit=null;render()},
  async enh(){const i=byId(S.edit);if(!i)return;toast('Foto wird verbessert …');i.orig=i.orig||i.img;i.img=await enhance(i.img);put('items',i);render()},
  orig(){const i=byId(S.edit);if(i&&i.orig){i.img=i.orig;delete i.orig;put('items',i);render()}},
  ai1(){const i=byId(S.edit);if(i)aiDescribe(i)},
  async cutout(){const i=byId(S.edit);if(!i)return;toast('Hintergrund wird analysiert …');i.orig=i.orig||i.img;i.img=await removeBg(i.img);put('items',i);render();toast('Freistellung erstellt – bitte Ergebnis prüfen')},
  async colors(){return runAdvice('color')},
  async advise(){return runAdvice('outfit')},
  async generate(){if(S.w)mixNow(S.w);return runAdvice('generate')},
  async buyadvice(){return runAdvice('buy')},
  async weatherai(id,v,b){const w=v==='tomorrow'?S.wm:S.w;if(!w)return;return runAdvice('weather',w)},
  mix(){mixNow();render()},
  reload(){loadWeather()},
  sugsave(){const o={id:uid(),name:'Outfit vom '+new Date().toLocaleDateString('de-DE'),items:[...S.sug],ts:Date.now()};S.outfits.push(o);put('outfits',o);toast('Outfit gespeichert')},
  savekey(){S.key=($('#key').value||'').trim();saveSet();render();toast(S.key?'Schlüssel gespeichert':'Kein Schlüssel eingegeben')},
  delkey(){S.key='';saveSet();render()},
  geo(){if(!navigator.geolocation){toast('Standortzugriff nicht verfügbar');return}
    navigator.geolocation.getCurrentPosition(q=>{S.loc={name:'Dein Standort',lat:q.coords.latitude,lon:q.coords.longitude};saveSet();S.w=null;S.sug=[];S.tab='heute';render();loadWeather()},()=>toast('Kein Standortzugriff. Gib stattdessen eine Stadt ein.'),{timeout:10000})},
  async city(){const q=($('#city').value||'').trim();if(!q)return;
    try{const j=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name='+encodeURIComponent(q))).json(),r=j.results&&j.results[0];
      if(!r){toast('Ort nicht gefunden');return}
      S.loc={name:r.name,lat:r.latitude,lon:r.longitude};saveSet();S.w=null;S.sug=[];S.tab='heute';render();loadWeather()}
    catch(e){toast('Suche fehlgeschlagen')}},
  async aisug(){
    if(!S.key||!S.w)return;toast('Die Stylistin überlegt …');const w=S.w;
    const list=S.items.map(i=>`${i.id}|${i.cat} (${i.subcat||''})|${i.desc||'-'}|${i.mat||'-'}|Wärme ${i.warm||2}|${i.wp?'wasserfest':'-'}`).join('\n');
    try{const j=await claude(`Du bist eine Stylistin. Wetter heute: ${WT(w.code)}, ${Math.round(w.t)} °C, gefühlt ${Math.round(w.feel)} °C, ${Math.round(w.min)} bis ${Math.round(w.max)} °C, Regenwahrscheinlichkeit ${w.pp} %, Wind ${Math.round(w.wind)} km/h.\nKleiderschrank (id|Kategorie|Beschreibung|Material|Wärme 1-5|wasserfest):\n${list}\nStelle ein stimmiges Outfit nur aus diesen Teilen zusammen, höchstens ein Teil je Kategorie, kombiniere Oberteil und Hose passend zum Wetter. Antworte nur mit JSON: {"ids":["id1","id2"],"grund":"zwei Sätze auf Deutsch, die Wetter und Material berücksichtigen"}`,500);
      const ids=(j.ids||[]).filter(byId);if(!ids.length)throw new Error('Keine passenden Teile');
      S.sug=ids;S.why=j.grund||'';S.ai=true;render()}
    catch(e){toast('KI-Empfehlung fehlgeschlagen: '+String(e.message||e).slice(0,70))}}
};
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f||!S.edit)return;const i=byId(S.edit);if(!i)return;
  i[f]=f==='wp'?t.checked:f==='warm'?+t.value:t.value;i.ai=false;put('items',i);if(f!=='desc'&&f!=='mat')S.sug=[];
});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
